services:
  waitless-frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    container_name: waitlessfrontend
    ports:
      - 3000:3000

    environment:
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    
    networks:
      - waitlessnet

networks:
  waitlessnet:
    driver: bridge